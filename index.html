<title>MISIK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="기록이 쌓일수록 나를 더 잘 아는 맛집 리뷰 서비스" />
<meta name="color-scheme" content="light" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="css/styles.css" />

<aside class="sidebar">
  <a class="logo" href="#" id="logoLink">MIS<span>IK</span></a>
  <nav class="side-nav">
    <button class="side-nav-btn active" data-tab="discover">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21" stroke-linecap="round"/></svg>
      <span>둘러보기</span>
    </button>
    <button class="side-nav-btn" data-tab="archive">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="7" width="17" height="13" rx="1"/><path d="M3.5 7 L6 3.5 H18 L20.5 7" /><path d="M10 11.5 H14" stroke-linecap="round"/></svg>
      <span>내 기록</span>
    </button>
    <button class="side-nav-btn" data-tab="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21" stroke-linecap="round"/><path d="M10.5 7.5 v6 M7.5 10.5 h6" stroke-linecap="round"/></svg>
      <span>맛집 담기</span>
    </button>
    <button class="side-nav-btn" data-tab="personalize">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 v3 M12 18 v3 M3 12 h3 M18 12 h3 M5.6 5.6 l2.1 2.1 M16.3 16.3 l2.1 2.1 M18.4 5.6 l-2.1 2.1 M7.7 16.3 l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
      <span>내 취향</span>
    </button>
  </nav>
</aside>

<main class="app-main">

  <!-- DISCOVER -->
  <section id="tab-discover" class="tab-panel">
    <div class="section-inner">
      <div id="discoverGridView">
        <div class="kicker">Misik Index</div>
        <h1 class="masthead-title">오늘, 어디로 가볼까요?</h1>
        <div class="masthead-filters">
          <span class="mf-item">
            <label for="searchInput">찾는 곳</label>
            <input type="text" id="searchInput" placeholder="가게 이름, 키워드" />
          </span>
          <span class="mf-sep">·</span>
          <span class="mf-item">
            <label for="regionSelect">지역</label>
            <select id="regionSelect"><option value="">전체</option></select>
          </span>
          <span class="mf-sep">·</span>
          <span class="mf-item">
            <label for="categorySelect">종류</label>
            <select id="categorySelect"><option value="">전체</option></select>
          </span>
        </div>
        <div class="rule"></div>
        <div id="featuredWrap"></div>
        <div class="card-grid" id="restaurantGrid"></div>
      </div>
    </div>
  </section>

  <!-- ARCHIVE -->
  <section id="tab-archive" class="tab-panel">
    <div class="section-inner">
      <div class="panel-box">
        <div class="archive-grid">
          <div>
            <div class="field">
              <label for="acName">가게명</label>
              <input type="text" id="acName" placeholder="예: 온기당" />
            </div>
            <div class="field">
              <label for="acDate">방문일</label>
              <input type="date" id="acDate" />
            </div>
            <div class="field">
              <label for="acCategory">카테고리</label>
              <select id="acCategory">
                <option value="한식">한식</option>
                <option value="일식">일식</option>
                <option value="양식">양식</option>
                <option value="카페">카페</option>
                <option value="중식">중식</option>
                <option value="분식">분식</option>
              </select>
            </div>
            <div class="field">
              <label>별점</label>
              <div class="star-picker" id="starPicker">
                <button type="button" data-star="1">★</button>
                <button type="button" data-star="2">★</button>
                <button type="button" data-star="3">★</button>
                <button type="button" data-star="4">★</button>
                <button type="button" data-star="5">★</button>
              </div>
            </div>
            <div class="field">
              <label for="acPhoto">사진</label>
              <input type="file" id="acPhoto" accept="image/*" />
            </div>
            <div class="field">
              <label for="acNote">한줄평</label>
              <textarea id="acNote" placeholder="어떤 점이 좋았나요?"></textarea>
            </div>
            <button class="btn" id="acSubmit">기록 추가</button>
            <button class="btn ghost" id="acClear" style="margin-left:8px;">전체 초기화</button>
            <p class="field-hint">기록은 이 브라우저에 저장됩니다.</p>
          </div>
          <div class="archive-cards" id="archiveCards"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- SEARCH (맛집 담기) -->
  <section id="tab-search" class="tab-panel">
    <div class="section-inner">
      <div id="searchTabRoot"></div>
    </div>
  </section>

  <!-- PERSONALIZE -->
  <section id="tab-personalize" class="tab-panel">
    <div class="section-inner">
      <div class="stat-row" id="statRow"></div>

      <div class="personalize-grid">
        <div class="viz-box">
          <div class="viz-title">취향 분포 — 카테고리</div>
          <div class="donut-wrap">
            <div id="donut"></div>
            <div class="donut-legend" id="donutLegend"></div>
          </div>
        </div>
        <div class="viz-box">
          <div class="viz-title">자주 등장한 키워드</div>
          <div class="wordcloud" id="wordcloud"></div>
        </div>
      </div>

      <div class="ai-box">
        <div class="viz-title">리뷰 요약 · 감성 분석</div>
        <textarea id="aiInput">웨이팅은 좀 길었지만 재료가 신선하고 사장님이 정말 친절했어요. 가격대는 살짝 있는 편이지만 분위기가 좋아서 데이트 코스로 재방문 의사 있습니다. 다만 화장실이 조금 불편했어요.</textarea>
        <button class="btn" id="aiRun" style="margin-top:12px;">감성 분석 실행</button>
        <div class="ai-result" id="aiResult">
          <div class="sentiment-bar"><div class="pos" id="posBar"></div><div class="neg" id="negBar"></div></div>
          <div class="sentiment-labels"><span id="posLabel">긍정 0%</span><span id="negLabel">부정 0%</span></div>
          <div class="ai-summary" id="aiSummary"></div>
        </div>
      </div>
    </div>
  </section>

</main>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card" id="modalCard">
    <button class="modal-close" id="modalClose" aria-label="닫기">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5 L19 19 M19 5 L5 19" stroke-linecap="round"/></svg>
    </button>
    <div class="restaurant-header" id="restaurantHeader"></div>
    <div class="trust-filter">
      <button class="chip active" data-filter="all">전체</button>
      <button class="chip" data-filter="visited">직접 방문만</button>
      <button class="chip" data-filter="sponsored">협찬 표시</button>
    </div>
    <div class="review-list" id="detailReviewList"></div>
  </div>
</div>

<footer>
  <span>© 2026 MISIK</span>
  <span>Discover · Trust · Archive · Personalize</span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
<script src="js/app.js"></script>
<script src="js/kakao-config.js"></script>
<script src="js/kakao-search.js"></script>
