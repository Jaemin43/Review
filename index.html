<title>MISIK</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="기록이 쌓일수록 나를 더 잘 아는 맛집 리뷰 서비스" />
<meta name="color-scheme" content="light" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT/fonts/variable/woff2/SUIT-Variable.css" />

<style>
  :root {
    color-scheme: light;
    --bg: #F7F3E8;
    --text: #29231E;
    --text-body: #766F67;
    --text-secondary: #766F67;
    --accent: #E8B92E;
    --accent-light: #F3D46A;
    --accent-dark: #A9791E;
    --border: #DCD4C7;
    --card: #FFFDF8;
    --serif: 'SUIT Variable', 'Pretendard Variable', -apple-system, sans-serif;
    --serif-en: 'SUIT Variable', 'Pretendard Variable', -apple-system, sans-serif;
    --sans: 'Pretendard Variable', 'SUIT Variable', -apple-system, sans-serif;
    --sidebar-w: 220px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  img, svg { display: block; max-width: 100%; }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; }

  .kicker {
    font-family: var(--sans); font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--accent);
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: var(--sidebar-w);
    background: var(--bg);
    border-right: 1px solid var(--border);
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
    gap: 40px;
    z-index: 100;
    overflow-y: auto;
  }

  .logo { font-family: var(--serif-en); font-weight: 900; font-size: 20px; letter-spacing: -0.02em; padding-left: 14px; }
  .logo span { color: var(--accent); }

  .side-nav { display: flex; flex-direction: column; gap: 4px; }

  .side-nav-btn {
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 12px 14px;
    border: none; border-left: 2px solid transparent; border-radius: 0;
    background: none; cursor: pointer; text-align: left;
    font-family: var(--sans); font-size: 14px; font-weight: 600;
    color: var(--text-secondary);
    transition: 0.15s;
  }
  .side-nav-btn svg { flex-shrink: 0; }
  .side-nav-btn:hover { color: var(--text); }
  .side-nav-btn.active { color: var(--text); border-left-color: var(--accent); }

  @media (max-width: 760px) {
    .sidebar {
      position: static; width: 100%; height: auto;
      flex-direction: row; align-items: center; justify-content: space-between;
      padding: 14px 20px; border-right: none; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .logo { font-size: 16px; padding-left: 0; }
    .side-nav { flex-direction: row; gap: 4px; }
    .side-nav-btn { flex-direction: column; gap: 4px; width: auto; padding: 6px 10px; font-size: 11px; border-left: none; border-bottom: 2px solid transparent; }
    .side-nav-btn.active { border-bottom-color: var(--accent); }
  }

  /* ---------- Main shell ---------- */
  html { scroll-snap-type: y proximity; scroll-behavior: smooth; }
  .app-main { margin-left: var(--sidebar-w); max-width: 1160px; }
  footer {
    margin-left: var(--sidebar-w);
    padding: 24px 40px; border-top: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    font-size: 13px; color: var(--text-secondary);
    scroll-snap-align: start;
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-snap-type: none; scroll-behavior: auto; }
  }

  @media (max-width: 760px) {
    .app-main { margin-left: 0; }
    footer { margin-left: 0; padding: 20px; }
  }

  .tab-panel {
    display: flex; flex-direction: column; justify-content: center;
    min-height: 100vh; padding: 100px 40px 60px;
    scroll-snap-align: start;
  }
  @media (max-width: 760px) { .tab-panel { padding: 80px 20px 48px; } }

  .section-inner {
    opacity: 0; transform: translateY(28px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .section-inner.in { opacity: 1; transform: translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .section-inner { opacity: 1; transform: none; transition: none; }
  }

  /* ---------- Discover: masthead ---------- */
  .masthead-title {
    font-family: var(--serif); font-size: clamp(30px, 4vw, 42px); font-weight: 900;
    letter-spacing: -0.02em; margin: 10px 0 28px;
  }

  .masthead-filters { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .mf-item { display: inline-flex; align-items: baseline; gap: 8px; }
  .mf-item label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--text-secondary);
  }
  .mf-sep { color: var(--border); }

  .masthead-filters input[type="text"], .masthead-filters select {
    font-family: var(--sans); font-size: 15px; font-weight: 600; color: var(--text);
    border: none; border-bottom: 1px solid var(--border); background: transparent;
    padding: 2px 2px 5px; border-radius: 0; transition: 0.15s;
  }
  .masthead-filters input[type="text"] { width: 170px; }
  .masthead-filters input[type="text"]:focus, .masthead-filters select:focus {
    outline: none; border-bottom-color: var(--accent);
  }

  .rule { height: 1px; background: var(--border); margin: 32px 0; }

  /* ---------- Discover: featured spread ---------- */
  .featured {
    display: grid; grid-template-columns: 1.1fr 1fr;
    width: 100%; text-align: left; background: none; border: 1px solid var(--border);
    border-radius: 0; padding: 0; cursor: pointer; margin-bottom: 48px; transition: border-color 0.2s;
  }
  .featured:hover { border-color: var(--accent); }
  .featured-visual {
    background: var(--bg); border-right: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; padding: 48px; min-height: 280px;
    overflow: hidden; position: relative;
  }
  .featured-visual .brand-mark {
    font-family: var(--serif-en); font-weight: 900; letter-spacing: -0.02em;
    font-size: clamp(48px, 8vw, 104px); color: var(--border); user-select: none;
  }
  .featured-info { padding: 40px; display: flex; flex-direction: column; }
  .featured-order { font-size: 12px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-secondary); margin-top: 6px; }
  .featured-name { font-family: var(--serif); font-size: clamp(30px, 3.6vw, 44px); font-weight: 900; letter-spacing: -0.02em; margin: 14px 0 18px; }
  .featured-meta { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-secondary); line-height: 1.9; }
  .featured-rating {
    font-family: var(--serif); font-size: clamp(38px, 4.6vw, 52px); font-weight: 900; letter-spacing: -0.02em;
    color: var(--accent); font-variant-numeric: tabular-nums; margin-top: 18px;
  }
  .featured-desc { margin-top: 8px; font-size: 13px; font-weight: 400; color: var(--text-body); }

  @media (max-width: 760px) {
    .featured { grid-template-columns: 1fr; }
    .featured-visual { border-right: none; border-bottom: 1px solid var(--border); min-height: 180px; padding: 32px; }
    .featured-info { padding: 28px; }
  }

  /* ---------- Discover: editorial card grid ---------- */
  .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-flow: dense; gap: 24px; }
  @media (max-width: 900px) { .card-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 600px) { .card-grid { grid-template-columns: 1fr; } }

  .rcard {
    display: flex; flex-direction: column;
    border: 1px solid var(--border); border-radius: 0; padding: 24px;
    text-align: left; background: none; cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .rcard:hover { border-color: var(--accent); transform: translateY(-2px); }
  .rcard:hover .rcard-name { color: var(--accent-dark); }

  .rcard--medium { grid-column: span 2; }
  .rcard--visual { justify-content: space-between; }
  @media (max-width: 600px) { .rcard--medium { grid-column: span 1; } }

  .rcard-icon { color: var(--accent); margin-bottom: 18px; }
  .rcard-icon svg { width: 36px; height: 36px; }
  .rcard-num { font-size: 12px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; margin-bottom: 14px; }
  .rcard-name { font-family: var(--serif); font-weight: 800; font-size: 19px; letter-spacing: -0.01em; transition: color 0.15s; }
  .rcard-meta { margin-top: 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-secondary); line-height: 1.8; }
  .rcard-desc { margin-top: 10px; font-size: 12.5px; color: var(--text-body); }
  .rcard-rating { margin-top: 16px; font-family: var(--serif); font-size: 22px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }

  .empty-state { color: var(--text-body); font-size: 14px; padding: 24px 0; }

  /* ---------- Restaurant modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 300;
    background: rgba(41, 35, 30, 0.5);
    display: none; align-items: flex-start; justify-content: center;
    padding: 64px 24px; overflow-y: auto;
    opacity: 0; transition: opacity 0.25s ease;
  }
  .modal-overlay.open { display: flex; opacity: 1; }
  body.modal-open { overflow: hidden; }

  .modal-card {
    background: var(--bg); border: 1px solid var(--border);
    width: min(640px, 100%); padding: 44px; position: relative;
  }
  @media (max-width: 640px) { .modal-card { padding: 28px; } }

  .modal-close {
    position: absolute; top: 20px; right: 20px;
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: none; border: 1px solid var(--border); cursor: pointer;
    color: var(--text-secondary); transition: 0.15s;
  }
  .modal-close:hover { color: var(--text); border-color: var(--accent); }

  .restaurant-header { padding-bottom: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .restaurant-header .kicker { margin-bottom: 10px; }
  .restaurant-header .rh-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .restaurant-header .rh-name { font-family: var(--serif); font-size: clamp(26px, 3.4vw, 32px); font-weight: 900; letter-spacing: -0.02em; }
  .restaurant-header .rh-rating { color: var(--accent); font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .restaurant-header .rh-meta { font-size: 13px; color: var(--text-body); margin-top: 10px; }

  .trust-filter {
    display: flex; gap: 20px; margin-bottom: 28px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .chip {
    background: none; border: none; padding: 0 0 4px; cursor: pointer;
    color: var(--text-secondary); border-bottom: 2px solid transparent; transition: 0.15s;
  }
  .chip.active { color: var(--text); border-bottom-color: var(--accent); }

  .review-list { display: flex; flex-direction: column; }
  .review-card { padding: 20px 0; border-bottom: 1px solid var(--border); }
  .review-card:first-child { padding-top: 0; }

  .review-byline {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    font-size: 11.5px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--text-secondary);
  }
  .review-byline .rb-visited { color: var(--accent-dark); }
  .review-byline .rb-rating {
    margin-left: auto; color: var(--accent); font-size: 13px; letter-spacing: 0;
    text-transform: none; font-variant-numeric: tabular-nums;
  }
  .review-text { font-size: 13.5px; color: var(--text-body); margin-top: 12px; line-height: 1.6; }

  /* ---------- Archive ---------- */
  .panel-box { border-top: 1px solid var(--border); padding-top: 32px; }

  .archive-grid { display: grid; grid-template-columns: 340px 1fr; gap: 40px; }
  @media (max-width: 800px) { .archive-grid { grid-template-columns: 1fr; } }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 8px; }
  .field input[type="text"], .field input[type="date"], .field select {
    width: 100%; font-family: var(--sans); font-size: 14px; font-weight: 600;
    border: none; border-bottom: 1px solid var(--border); background: transparent; color: var(--text);
    border-radius: 0; padding: 6px 2px;
  }
  .field input[type="text"]:focus, .field input[type="date"]:focus, .field select:focus { outline: none; border-bottom-color: var(--accent); }
  .field textarea {
    width: 100%; font-family: var(--sans); font-size: 14px; padding: 10px 12px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 2px;
    resize: vertical; min-height: 64px;
  }
  .field textarea:focus { outline: none; border-color: var(--accent); }
  .field input[type="file"] { font-size: 13px; }

  .star-picker { display: flex; gap: 6px; }
  .star-picker button { background: none; border: none; cursor: pointer; font-size: 22px; color: var(--border); line-height: 1; }
  .star-picker button.filled { color: var(--accent); }

  .btn {
    display: inline-block; font-family: var(--sans); font-size: 14px; font-weight: 600;
    padding: 12px 24px; background: var(--text); color: var(--bg); border: none; border-radius: 0;
    cursor: pointer; transition: 0.2s;
  }
  .btn:hover { background: var(--accent-dark); }
  .btn.ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }

  /* ---------- Archive: timeline ---------- */
  .archive-cards { position: relative; max-height: 560px; overflow-y: auto; padding-right: 4px; }
  .archive-cards.has-items { padding-left: 24px; }
  .archive-cards.has-items::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--border); }

  .timeline-item { position: relative; padding-bottom: 24px; }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-dot { position: absolute; left: -24px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--bg); }
  .timeline-content { display: flex; gap: 14px; }

  .ac-thumb { width: 56px; height: 56px; border-radius: 0; object-fit: cover; flex-shrink: 0; background: var(--card); border: 1px solid var(--border); }
  .ac-body { flex: 1; min-width: 0; }
  .ac-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .ac-name { font-family: var(--serif); font-weight: 700; font-size: 15px; }
  .ac-stars { color: var(--accent); font-size: 13px; flex-shrink: 0; }
  .ac-meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
  .ac-note { font-size: 13px; margin-top: 8px; color: var(--text-body); }

  .field-hint { font-size: 11px; color: var(--text-body); margin-top: 16px; }

  /* ---------- Personalize ---------- */
  .stat-row { display: flex; margin-bottom: 40px; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
  .stat-box { flex: 1; padding: 24px 28px; border-right: 1px solid var(--border); }
  .stat-box:first-child { padding-left: 0; }
  .stat-box:last-child { border-right: none; }
  @media (max-width: 700px) {
    .stat-row { flex-direction: column; }
    .stat-box { border-right: none; border-bottom: 1px solid var(--border); padding-left: 0; }
    .stat-box:last-child { border-bottom: none; }
  }
  .stat-value { font-family: var(--serif); font-size: 34px; font-weight: 900; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: var(--accent); }
  .stat-label { margin-top: 6px; font-size: 11px; color: var(--text-secondary); letter-spacing: 0.1em; text-transform: uppercase; }

  .personalize-grid { display: grid; grid-template-columns: 1fr 1fr; column-gap: 48px; margin-bottom: 40px; }
  .personalize-grid .viz-box:last-child { border-left: 1px solid var(--border); padding-left: 48px; }
  @media (max-width: 800px) {
    .personalize-grid { grid-template-columns: 1fr; row-gap: 32px; }
    .personalize-grid .viz-box:last-child { border-left: none; padding-left: 0; border-top: 1px solid var(--border); padding-top: 32px; }
  }

  .viz-title { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 22px; }

  .donut-wrap { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  #donut { width: 150px; height: 150px; border-radius: 50%; flex-shrink: 0; position: relative; }
  .donut-legend { display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
  .legend-row { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .wordcloud { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; min-height: 150px; align-content: center; }
  .wordcloud span { font-family: var(--serif); }

  .ai-box { border-top: 1px solid var(--border); padding-top: 32px; }
  .ai-box textarea {
    width: 100%; font-family: var(--sans); font-size: 14px; padding: 12px;
    border: 1px solid var(--border); background: var(--card); border-radius: 2px; min-height: 90px; resize: vertical;
  }
  .ai-box textarea:focus { outline: none; border-color: var(--accent); }
  .ai-result { margin-top: 20px; display: none; }
  .ai-result.show { display: block; }
  .sentiment-bar { height: 6px; background: var(--border); overflow: hidden; display: flex; margin-top: 8px; }
  .sentiment-bar .pos { background: var(--accent); height: 100%; }
  .sentiment-bar .neg { background: #B08A6E; height: 100%; }
  .sentiment-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
  .ai-summary { margin-top: 16px; font-size: 14px; padding-left: 16px; border-left: 2px solid var(--accent); color: var(--text-body); }
</style>

<aside class="sidebar">
  <a class="logo" href="#" id="logoLink">MIS<span>IK</span></a>
  <nav class="side-nav">
    <button class="side-nav-btn active" data-tab="discover">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 L21 21" stroke-linecap="round"/></svg>
      <span>둘러보기</span>
    </button>
    <button class="side-nav-btn" data-tab="archive">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="7" width="17" height="13" rx="1"/><path d="M3.5 7 L6 3.5 H18 L20.5 7" /><path d="M10 11.5 H14" stroke-linecap="round"/></svg>
      <span>내 기록</span>
    </button>
    <button class="side-nav-btn" data-tab="personalize">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3 v3 M12 18 v3 M3 12 h3 M18 12 h3 M5.6 5.6 l2.1 2.1 M16.3 16.3 l2.1 2.1 M18.4 5.6 l-2.1 2.1 M7.7 16.3 l-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
      <span>내 취향</span>
    </button>
  </nav>
</aside>

<main class="app-main">

  <!-- DISCOVER -->
  <section id="tab-discover" class="tab-panel">
    <div class="section-inner">
      <div id="discoverGridView">
        <div class="kicker">Misik Index</div>
        <h1 class="masthead-title">오늘, 어디로 가볼까요?</h1>
        <div class="masthead-filters">
          <span class="mf-item">
            <label for="searchInput">찾는 곳</label>
            <input type="text" id="searchInput" placeholder="가게 이름, 키워드" />
          </span>
          <span class="mf-sep">·</span>
          <span class="mf-item">
            <label for="regionSelect">지역</label>
            <select id="regionSelect"><option value="">전체</option></select>
          </span>
          <span class="mf-sep">·</span>
          <span class="mf-item">
            <label for="categorySelect">종류</label>
            <select id="categorySelect"><option value="">전체</option></select>
          </span>
        </div>
        <div class="rule"></div>
        <div id="featuredWrap"></div>
        <div class="card-grid" id="restaurantGrid"></div>
      </div>
    </div>
  </section>

  <!-- ARCHIVE -->
  <section id="tab-archive" class="tab-panel">
    <div class="section-inner">
      <div class="panel-box">
        <div class="archive-grid">
          <div>
            <div class="field">
              <label for="acName">가게명</label>
              <input type="text" id="acName" placeholder="예: 온기당" />
            </div>
            <div class="field">
              <label for="acDate">방문일</label>
              <input type="date" id="acDate" />
            </div>
            <div class="field">
              <label for="acCategory">카테고리</label>
              <select id="acCategory">
                <option value="한식">한식</option>
                <option value="일식">일식</option>
                <option value="양식">양식</option>
                <option value="카페">카페</option>
                <option value="중식">중식</option>
                <option value="분식">분식</option>
              </select>
            </div>
            <div class="field">
              <label>별점</label>
              <div class="star-picker" id="starPicker">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/Flip.min.js"></script>
<script>
  // ---------- Nav ----------
  const navBtns = document.querySelectorAll('.side-nav-btn');
  const tabPanels = document.querySelectorAll('.tab-panel');

  function scrollToTab(name) {
    const target = document.getElementById('tab-' + name);
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  navBtns.forEach(btn => btn.addEventListener('click', () => scrollToTab(btn.dataset.tab)));
  document.getElementById('logoLink').addEventListener('click', (e) => {
    e.preventDefault();
    closeModal();
    scrollToTab('discover');
  });

  // Highlight the sidebar item for whichever section is currently in view.
  if ('IntersectionObserver' in window) {
    const spyObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (!entry.isIntersecting) return;
        const name = entry.target.id.replace('tab-', '');
        navBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === name));
      });
    }, { threshold: 0.5 });
    tabPanels.forEach(p => spyObserver.observe(p));

    // Fade + slide each section's content in as it scrolls into view.
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => entry.target.classList.toggle('in', entry.isIntersecting));
    }, { threshold: 0.2 });
    document.querySelectorAll('.section-inner').forEach(el => revealObserver.observe(el));
  } else {
    document.querySelectorAll('.section-inner').forEach(el => el.classList.add('in'));
  }

  // ---------- Mock data: restaurants + reviews ----------
  const RESTAURANTS = [
    { id: 1, name: "온기당", region: "성수", category: "한식", price: "3만원대", tag: "조용한 분위기" },
    { id: 2, name: "미도리 스시바", region: "연남", category: "일식", price: "5만원대", tag: "혼밥 추천" },
    { id: 3, name: "브리크레인", region: "을지로", category: "양식", price: "4만원대", tag: "데이트 코스" },
    { id: 4, name: "낮잠커피", region: "망원", category: "카페", price: "1만원대", tag: "가성비" },
    { id: 5, name: "홍대짬뽕집", region: "홍대", category: "중식", price: "2만원대", tag: "곱빼기 인기" },
    { id: 6, name: "이태원분식", region: "이태원", category: "분식", price: "1만원대", tag: "매콤한 맛" },
    { id: 7, name: "성수정육식당", region: "성수", category: "한식", price: "4만원대", tag: "재방문의사 높음" },
    { id: 8, name: "연남스텐드", region: "연남", category: "카페", price: "1만원대", tag: "뷰맛집" },
  ];

  const REVIEWS = [
    { restaurantId: 1, rating: 4.8, visited: true, sponsored: false, date: "2026.03.12", content: "직접 방문해서 먹은 냉이된장찌개가 정말 좋았어요. 재료가 신선하고 사장님도 친절했습니다." },
    { restaurantId: 1, rating: 4.5, visited: true, sponsored: false, date: "2026.01.05", content: "조용한 분위기라 혼자 가기 좋았어요. 다만 웨이팅이 좀 길었습니다." },
    { restaurantId: 2, rating: 4.5, visited: true, sponsored: true, date: "2026.02.02", content: "업체 협찬으로 방문했습니다. 사전 제공된 오마카세 코스를 시식했어요." },
    { restaurantId: 3, rating: 4.3, visited: true, sponsored: false, date: "2026.01.20", content: "데이트로 다녀왔는데 분위기와 플레이팅이 훌륭했습니다. 웨이팅은 30분 정도." },
    { restaurantId: 4, rating: 4.6, visited: false, sponsored: true, date: "2026.04.01", content: "브랜드 측 제공 정보를 바탕으로 작성된 소개형 리뷰입니다." },
    { restaurantId: 5, rating: 4.4, visited: true, sponsored: false, date: "2025.11.09", content: "곱빼기를 시켰는데 양이 정말 많았어요. 국물이 진하고 재방문 의사 있습니다." },
    { restaurantId: 5, rating: 3.9, visited: true, sponsored: false, date: "2025.09.14", content: "맛은 괜찮았지만 가격이 살짝 아쉬웠어요. 그래도 곱빼기는 만족스러웠습니다." },
    { restaurantId: 6, rating: 4.1, visited: true, sponsored: false, date: "2025.10.15", content: "떡볶이가 꽤 매웠지만 중독적인 맛이었어요. 웨이팅이 길어서 아쉬웠습니다." },
    { restaurantId: 7, rating: 4.9, visited: true, sponsored: false, date: "2025.12.11", content: "혼자 방문해서 1인분 주문했는데도 정성스럽게 내주셨어요. 재방문 의사 100%." },
    { restaurantId: 7, rating: 4.7, visited: true, sponsored: false, date: "2025.08.22", content: "가족 모임으로 방문했는데 반찬이 신선하고 친절했습니다." },
    { restaurantId: 8, rating: 4.4, visited: true, sponsored: true, date: "2026.03.28", content: "협찬으로 방문했지만 실제로 뷰가 좋았고 커피 맛도 신선했습니다." },
  ];

  function reviewsFor(id) { return REVIEWS.filter(r => r.restaurantId === id); }
  function avgRatingNum(id) {
    const list = reviewsFor(id);
    if (!list.length) return 0;
    return list.reduce((sum, r) => sum + r.rating, 0) / list.length;
  }
  function avgRating(id) {
    const list = reviewsFor(id);
    return list.length ? avgRatingNum(id).toFixed(1) : '-';
  }

  const searchInput = document.getElementById('searchInput');
  const regionSelect = document.getElementById('regionSelect');
  const categorySelect = document.getElementById('categorySelect');
  const featuredWrap = document.getElementById('featuredWrap');
  const restaurantGrid = document.getElementById('restaurantGrid');

  [...new Set(RESTAURANTS.map(r => r.region))].forEach(r => {
    const opt = document.createElement('option'); opt.value = r; opt.textContent = r;
    regionSelect.appendChild(opt);
  });
  [...new Set(RESTAURANTS.map(r => r.category))].forEach(c => {
    const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
    categorySelect.appendChild(opt);
  });

  const ICON_BOWL = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 28 h40 a20 16 0 0 1-40 0 z" stroke-linejoin="round"/><path d="M18 28 a14 10 0 0 0 28 0"/><path d="M26 12 q2 5 0 10 M34 12 q2 5 0 10" stroke-linecap="round"/></svg>';
  const ICON_CUP = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 18 h28 v20 a14 14 0 0 1-28 0 z"/><path d="M42 24 h6 a6 6 0 0 1 0 12 h-6"/><path d="M22 10 q2 4 0 8 M30 10 q2 4 0 8" stroke-linecap="round"/></svg>';
  const ICON_PLATE = '<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="32" cy="32" r="20"/><circle cx="32" cy="32" r="11"/></svg>';
  const CATEGORY_ICON = { '한식': ICON_BOWL, '중식': ICON_BOWL, '분식': ICON_BOWL, '일식': ICON_PLATE, '양식': ICON_PLATE, '카페': ICON_CUP };

  function rcardHTML(r, rank) {
    const variant = rank % 5 === 0 ? 'medium' : rank % 5 === 2 ? 'visual' : 'compact';
    if (variant === 'medium') {
      return `
        <button class="rcard rcard--medium" data-id="${r.id}">
          <div class="rcard-num">${String(rank).padStart(2, '0')}</div>
          <div class="rcard-name">${r.name}</div>
          <div class="rcard-meta">${r.region} · ${r.category}</div>
          <div class="rcard-desc">${r.price} · ${r.tag}</div>
          <div class="rcard-rating">${avgRating(r.id)}</div>
        </button>
      `;
    }
    if (variant === 'visual') {
      return `
        <button class="rcard rcard--visual" data-id="${r.id}">
          <div class="rcard-icon">${CATEGORY_ICON[r.category] || ICON_BOWL}</div>
          <div>
            <div class="rcard-name">${r.name}</div>
            <div class="rcard-meta">${r.region}</div>
          </div>
          <div class="rcard-rating">${avgRating(r.id)}</div>
        </button>
      `;
    }
    return `
      <button class="rcard" data-id="${r.id}">
        <div class="rcard-num">${String(rank).padStart(2, '0')}</div>
        <div class="rcard-name">${r.name}</div>
        <div class="rcard-meta">${r.region} · ${r.category}</div>
        <div class="rcard-rating">${avgRating(r.id)}</div>
      </button>
    `;
  }

  function renderRestaurants() {
    const q = searchInput.value.trim().toLowerCase();
    const region = regionSelect.value;
    const category = categorySelect.value;

    const filtered = RESTAURANTS.filter(r => {
      const matchesQ = !q || r.name.toLowerCase().includes(q) || r.tag.toLowerCase().includes(q);
      const matchesRegion = !region || r.region === region;
      const matchesCategory = !category || r.category === category;
      return matchesQ && matchesRegion && matchesCategory;
    });

    if (!filtered.length) {
      featuredWrap.innerHTML = '';
      restaurantGrid.innerHTML = '<div class="empty-state">조건에 맞는 맛집이 없습니다.</div>';
      return;
    }

    const sorted = filtered.slice().sort((a, b) => avgRatingNum(b.id) - avgRatingNum(a.id));
    const featured = sorted[0];
    const rest = sorted.slice(1);

    featuredWrap.innerHTML = `
      <button class="featured" data-id="${featured.id}">
        <div class="featured-visual"><span class="brand-mark">MISIK</span></div>
        <div class="featured-info">
          <div class="kicker">MISIK SELECTED</div>
          <div class="featured-order">01 / THIS WEEK</div>
          <div class="featured-name">${featured.name}</div>
          <div class="featured-meta">${featured.region} · ${featured.category}</div>
          <div class="featured-rating">${avgRating(featured.id)}</div>
          <div class="featured-desc">${featured.tag}</div>
        </div>
      </button>
    `;

    restaurantGrid.innerHTML = rest.map((r, i) => rcardHTML(r, i + 1)).join('');
  }

  [searchInput, regionSelect, categorySelect].forEach(el => el.addEventListener('input', renderRestaurants));
  renderRestaurants();

  featuredWrap.addEventListener('click', (e) => {
    const card = e.target.closest('.featured');
    if (!card) return;
    openModal(card, Number(card.dataset.id));
  });

  restaurantGrid.addEventListener('click', (e) => {
    const card = e.target.closest('.rcard');
    if (!card) return;
    openModal(card, Number(card.dataset.id));
  });

  // ---------- Restaurant modal (GSAP Flip grid → modal morph) ----------
  gsap.registerPlugin(Flip);

  const modalOverlay = document.getElementById('modalOverlay');
  const modalCard = document.getElementById('modalCard');

  let currentRestaurantId = null;
  let detailTrustFilter = 'all';
  let sourceCardEl = null;

  function openModal(cardEl, id) {
    currentRestaurantId = id;
    detailTrustFilter = 'all';
    sourceCardEl = cardEl;
    document.querySelectorAll('#modalCard .trust-filter .chip').forEach(c => c.classList.toggle('active', c.dataset.filter === 'all'));
    renderModalReviews();

    const state = Flip.getState(cardEl);
    modalOverlay.classList.add('open');
    document.body.classList.add('modal-open');

    gsap.killTweensOf(modalCard);
    Flip.from(state, {
      targets: modalCard,
      duration: 0.6,
      ease: 'power3.inOut',
      absolute: true,
      scale: true,
    });
  }

  function closeModal() {
    if (!modalOverlay.classList.contains('open')) return;
    const targetEl = sourceCardEl && sourceCardEl.isConnected ? sourceCardEl : featuredWrap;

    gsap.killTweensOf(modalCard);
    Flip.fit(modalCard, targetEl, {
      duration: 0.5,
      ease: 'power3.inOut',
      scale: true,
      absolute: true,
      onComplete: () => {
        modalOverlay.classList.remove('open');
        document.body.classList.remove('modal-open');
        gsap.set(modalCard, { clearProps: 'all' });
      },
    });
  }

  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeModal();
  });
  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeModal();
  });

  function renderModalReviews() {
    const r = RESTAURANTS.find(x => x.id === currentRestaurantId);
    if (!r) return;

    document.getElementById('restaurantHeader').innerHTML = `
      <div class="kicker">${r.region} · ${r.category}</div>
      <div class="rh-top">
        <span class="rh-name">${r.name}</span>
        <span class="rh-rating">★ ${avgRating(r.id)} · 리뷰 ${reviewsFor(r.id).length}개</span>
      </div>
      <div class="rh-meta">${r.price} · ${r.tag}</div>
    `;

    const list = reviewsFor(r.id).filter(rv => {
      if (detailTrustFilter === 'visited') return rv.visited;
      if (detailTrustFilter === 'sponsored') return rv.sponsored;
      return true;
    });

    const detailReviewList = document.getElementById('detailReviewList');
    detailReviewList.innerHTML = list.length ? list.map(rv => `
      <div class="review-card">
        <div class="review-byline">
          <span class="rb-visited">${rv.visited ? '직접 방문' : '미방문 소개'}</span>
          ${rv.sponsored ? '<span>· 협찬</span>' : ''}
          <span>· ${rv.date}</span>
          <span class="rb-rating">★ ${rv.rating}</span>
        </div>
        <p class="review-text">${rv.content}</p>
      </div>
    `).join('') : '<div class="empty-state">조건에 맞는 리뷰가 없습니다.</div>';
  }

  document.querySelectorAll('#modalCard .trust-filter .chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('#modalCard .trust-filter .chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      detailTrustFilter = chip.dataset.filter;
      renderModalReviews();
    });
  });

  // ---------- Archive ----------
  const STORAGE_KEY = 'misikArchiveDemo';
  const archiveCards = document.getElementById('archiveCards');
  const starPicker = document.getElementById('starPicker');
  const acPhoto = document.getElementById('acPhoto');
  let selectedStars = 0;
  let selectedPhoto = null;

  starPicker.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    selectedStars = Number(btn.dataset.star);
    [...starPicker.children].forEach(b => b.classList.toggle('filled', Number(b.dataset.star) <= selectedStars));
  });

  acPhoto.addEventListener('change', () => {
    const file = acPhoto.files[0];
    if (!file) { selectedPhoto = null; return; }
    const reader = new FileReader();
    reader.onload = () => { selectedPhoto = reader.result; };
    reader.readAsDataURL(file);
  });

  function loadArchive() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveArchive(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
    catch { /* storage full — skip photo on next save */ }
  }

  function renderArchive() {
    const list = loadArchive();
    archiveCards.classList.toggle('has-items', list.length > 0);
    archiveCards.innerHTML = list.length ? list.slice().reverse().map(item => `
      <div class="timeline-item">
        <span class="timeline-dot"></span>
        <div class="timeline-content">
          ${item.photo ? `<img class="ac-thumb" src="${item.photo}" alt="${item.name}" />` : '<div class="ac-thumb"></div>'}
          <div class="ac-body">
            <div class="ac-top">
              <span class="ac-name">${item.name}</span>
              <span class="ac-stars">${'★'.repeat(item.stars)}${'☆'.repeat(5 - item.stars)}</span>
            </div>
            <div class="ac-meta">${item.date || '날짜 미입력'} · ${item.category}</div>
            ${item.note ? `<div class="ac-note">${item.note}</div>` : ''}
          </div>
        </div>
      </div>
    `).join('') : '<div class="empty-state">아직 기록이 없습니다. 왼쪽에서 첫 방문을 기록해보세요.</div>';
    renderPersonalize();
  }

  document.getElementById('acSubmit').addEventListener('click', () => {
    const name = document.getElementById('acName').value.trim();
    if (!name) { document.getElementById('acName').focus(); return; }
    const item = {
      name,
      date: document.getElementById('acDate').value,
      category: document.getElementById('acCategory').value,
      stars: selectedStars || 3,
      note: document.getElementById('acNote').value.trim(),
      photo: selectedPhoto,
    };
    const list = loadArchive();
    list.push(item);
    saveArchive(list);

    document.getElementById('acName').value = '';
    document.getElementById('acDate').value = '';
    document.getElementById('acNote').value = '';
    acPhoto.value = '';
    selectedPhoto = null;
    selectedStars = 0;
    [...starPicker.children].forEach(b => b.classList.remove('filled'));

    renderArchive();
  });

  document.getElementById('acClear').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_KEY);
    renderArchive();
  });

  // ---------- Personalize ----------
  const DEFAULT_CATEGORY_DIST = { '한식': 4, '일식': 2, '카페': 3, '양식': 2, '중식': 1, '분식': 1 };
  const DONUT_COLORS = ['#E8B92E', '#29231E', '#F3D46A', '#766F67', '#A9791E', '#DCD4C7'];

  const WORDS = [
    { w: '재방문의사', s: 30 }, { w: '가성비', s: 24 }, { w: '분위기', s: 26 },
    { w: '친절', s: 20 }, { w: '웨이팅', s: 18 }, { w: '데이트', s: 22 },
    { w: '신선한', s: 17 }, { w: '혼밥', s: 15 }, { w: '조용한', s: 16 }, { w: '뷰맛집', s: 14 },
  ];

  function renderStats() {
    const list = loadArchive();
    const statRow = document.getElementById('statRow');

    if (!list.length) {
      statRow.innerHTML = `
        <div class="stat-box"><div class="stat-value">0</div><div class="stat-label">총 기록</div></div>
        <div class="stat-box"><div class="stat-value">–</div><div class="stat-label">평균 별점</div></div>
        <div class="stat-box"><div class="stat-value">–</div><div class="stat-label">최다 카테고리</div></div>
      `;
      return;
    }

    const avgStars = (list.reduce((sum, i) => sum + i.stars, 0) / list.length).toFixed(1);
    const dist = {};
    list.forEach(i => { dist[i.category] = (dist[i.category] || 0) + 1; });
    const topCategory = Object.entries(dist).sort((a, b) => b[1] - a[1])[0][0];

    statRow.innerHTML = `
      <div class="stat-box"><div class="stat-value">${list.length}</div><div class="stat-label">총 기록</div></div>
      <div class="stat-box"><div class="stat-value">★ ${avgStars}</div><div class="stat-label">평균 별점</div></div>
      <div class="stat-box"><div class="stat-value">${topCategory}</div><div class="stat-label">최다 카테고리</div></div>
    `;
  }

  function renderDonut() {
    const list = loadArchive();
    let dist = {};
    if (list.length) {
      list.forEach(item => { dist[item.category] = (dist[item.category] || 0) + 1; });
    } else {
      dist = DEFAULT_CATEGORY_DIST;
    }

    const entries = Object.entries(dist);
    const total = entries.reduce((sum, [, v]) => sum + v, 0);

    let acc = 0;
    const stops = entries.map(([key, val], i) => {
      const start = (acc / total) * 360;
      acc += val;
      const end = (acc / total) * 360;
      return `${DONUT_COLORS[i % DONUT_COLORS.length]} ${start}deg ${end}deg`;
    }).join(', ');

    const donut = document.getElementById('donut');
    donut.style.background = `conic-gradient(${stops})`;
    donut.innerHTML = '<div style="position:absolute; inset:22%; background:var(--bg); border-radius:50%;"></div>';

    const legend = document.getElementById('donutLegend');
    legend.innerHTML = entries.map(([key, val], i) => `
      <div class="legend-row">
        <span class="legend-dot" style="background:${DONUT_COLORS[i % DONUT_COLORS.length]}"></span>
        ${key} · ${Math.round((val / total) * 100)}%
      </div>
    `).join('');
  }

  function renderWordcloud() {
    const cloud = document.getElementById('wordcloud');
    cloud.innerHTML = WORDS.map(item => `
      <span style="font-size:${item.s}px; color:${item.s > 22 ? 'var(--accent)' : 'var(--text-secondary)'}; font-weight:${item.s > 22 ? 600 : 500};">${item.w}</span>
    `).join('');
  }

  function renderPersonalize() { renderStats(); renderDonut(); renderWordcloud(); }

  // ---------- Sentiment analysis ----------
  const POSITIVE_WORDS = ['신선', '친절', '좋았', '재방문', '맛있', '분위기가 좋', '만족', '추천'];
  const NEGATIVE_WORDS = ['불편', '아쉬', '별로', '실망', '비싸', '오래 걸', '길었'];

  document.getElementById('aiRun').addEventListener('click', () => {
    const text = document.getElementById('aiInput').value;
    let pos = 0, neg = 0;
    POSITIVE_WORDS.forEach(w => { if (text.includes(w)) pos++; });
    NEGATIVE_WORDS.forEach(w => { if (text.includes(w)) neg++; });

    const total = pos + neg || 1;
    const posPct = Math.round((pos / total) * 100);
    const negPct = 100 - posPct;

    document.getElementById('posBar').style.width = posPct + '%';
    document.getElementById('negBar').style.width = negPct + '%';
    document.getElementById('posLabel').textContent = `긍정 ${posPct}%`;
    document.getElementById('negLabel').textContent = `부정 ${negPct}%`;

    let summary;
    if (posPct >= 70) summary = '전반적으로 만족도가 높은 리뷰입니다. 친절함과 재방문 의사에 대한 긍정 언급이 두드러집니다.';
    else if (posPct >= 40) summary = '긍정과 아쉬운 점이 함께 언급된 리뷰입니다. 맛과 분위기는 좋았지만 일부 불편함도 있었던 것으로 보입니다.';
    else summary = '부정적인 경험이 상대적으로 두드러지는 리뷰입니다. 재방문 전 참고할 만한 지적 사항이 있습니다.';

    document.getElementById('aiSummary').textContent = '요약: ' + summary;
    document.getElementById('aiResult').classList.add('show');
  });

  renderArchive();
</script>
