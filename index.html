<script>
  // 다크 모드 적용을 CSS/스크립트 로드보다 먼저 동기 실행해, 저장된(또는 OS) 테마와 다른
  // 기본값이 잠깐 보였다가 바뀌는 깜빡임(FOUC)을 막는다.
  (function () {
    try {
      var saved = localStorage.getItem('misikTheme');
      var theme = (saved === 'light' || saved === 'dark')
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

            </div>
            <div class="field">
              <label for="acDate">방문일</label>
              <input type="date" id="acDate" />
            </div>
            <div class="field">
              <label for="acCategory">카테고리</label>
              <select id="acCategory">
                <option value="한식">한식</option>
                <option value="일식">일식</option>
                <option value="양식">양식</option>
                <option value="카페">카페</option>
                <option value="중식">중식</option>
                <option value="분식">분식</option>
              </select>
            </div>
            <div class="field">
              <label>별점</label>
              <div class="star-picker" id="starPicker">
                <button type="button" data-star="1">★</button>
                <button type="button" data-star="2">★</button>
                <button type="button" data-star="3">★</button>
                <button type="button" data-star="4">★</button>
                <button type="button" data-star="5">★</button>
              </div>
            </div>
