<script>
  // 다크 모드 적용을 CSS/스크립트 로드보다 먼저 동기 실행해, 저장된(또는 OS) 테마와 다른
  // 기본값이 잠깐 보였다가 바뀌는 깜빡임(FOUC)을 막는다.
  (function () {
    try {
      var saved = localStorage.getItem('misikTheme');
      var theme = (saved === 'light' || saved === 'dark')
        ? saved
        : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  })();
</script>

<main class="app-main">

    <div class="section-inner">
      <div class="panel-box">
        <div class="archive-grid">
          <div>
            <h2 class="panel-heading">새 기록 추가</h2>
            <div class="field">
              <label for="acName">가게명 <span class="field-required" aria-hidden="true">*</span></label>
              <input type="text" id="acName" placeholder="예: 온기당" required minlength="2" aria-describedby="acNameError" />
              <p class="field-error" id="acNameError" hidden></p>
            </div>
            <div class="field">
              <label for="acDate">방문일</label>
              <input type="date" id="acDate" />
            </div>
            <div class="field">
              <label>카테고리</label>
              <div class="chip-group" id="acCategoryChips" role="group" aria-label="카테고리 선택">
                <button type="button" class="chip active" data-category="한식">한식</button>
                <button type="button" class="chip" data-category="일식">일식</button>
                <button type="button" class="chip" data-category="양식">양식</button>
                <button type="button" class="chip" data-category="카페">카페</button>
                <button type="button" class="chip" data-category="중식">중식</button>
                <button type="button" class="chip" data-category="분식">분식</button>
              </div>
            </div>
            <div class="field">
              <label>별점</label>
              <div class="star-picker" id="starPicker">
                <button type="button" data-star="1">★</button>
                <button type="button" data-star="2">★</button>
                <button type="button" data-star="3">★</button>
                <button type="button" data-star="4">★</button>
                <button type="button" data-star="5">★</button>
              </div>
            </div>
            <div class="field">
              <label for="acPhoto">사진</label>
              <input type="file" id="acPhoto" accept="image/*" />
            </div>
            <div class="field">
              <label for="acNote">한줄평</label>
              <textarea id="acNote" placeholder="어떤 점이 좋았나요?"></textarea>
            </div>
            <button class="btn" id="acSubmit" disabled>기록 추가</button>
            <button class="btn ghost" id="acClear" style="margin-left:8px;">전체 초기화</button>
            <p class="field-hint">
              기록은 이 브라우저에만 저장돼요. 다른 기기에서는 보이지 않고, 브라우저 데이터를 지우면 함께 사라질 수 있어요.
              <button type="button" class="field-hint-link" id="acLoginPrompt">로그인하면 안전하게 보관할 수 있어요 →</button>
            </p>
          </div>
          <div>
            <div class="archive-cards-head">
              <h2 class="panel-heading">최근 기록</h2>
              <select id="acSort" class="sort-select" aria-label="정렬 기준">
                <option value="recent">최신순</option>
                <option value="oldest">오래된순</option>
                <option value="starsDesc">별점 높은순</option>
                <option value="starsAsc">별점 낮은순</option>
              </select>
            </div>
            <div class="archive-cards" id="archiveCards"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
